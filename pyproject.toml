[project]
name = "nextchap"
version = "2.0.0"
description = "Continue web novels from EPUB/TXT with long-term story memory, on a budget."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.21",
    "rich>=14",
    "httpx>=0.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "chromadb>=1.3",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "platformdirs>=4.3",
    "filelock>=3.16",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=5.0", "torch>=2.6"]
rerank = ["transformers>=4.51", "torch>=2.6"]
keyring = ["keyring>=25"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
nextchap = "nextchap.cli.app:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nextchap"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = [
    "S101",   # asserts are fine in tests
    "S311",   # random is not used for crypto
    "RUF001", # prose prompts contain typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nextchap"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ebooklib", "ebooklib.*", "chromadb", "chromadb.*", "sentence_transformers", "transformers", "torch", "keyring", "bs4"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:nextchap.*",
    "ignore::DeprecationWarning:chromadb.*",
]
